[build]
command = "pnpm rebuild sharp && pnpm run build"
publish = "build"

[build.environment]
NODE_VERSION = "22"
SHARP_IGNORE_GLOBAL_LIBVIPS = "1"
AWS_LAMBDA_JS_RUNTIME = "nodejs22.x"

[functions]
node_bundler = "esbuild"
included_files = ["node_modules/sharp/**/*"]

# Always revalidate update metadata; long caching is safe only for hashed assets.
[[headers]]
for = "/sw.js"
[headers.values]
Cache-Control = "no-cache, max-age=0, must-revalidate"

[[headers]]
for = "/workbox-*.js"
[headers.values]
Cache-Control = "no-cache, max-age=0, must-revalidate"

[[headers]]
for = "/search-index.json"
[headers.values]
Cache-Control = "no-cache, max-age=0, must-revalidate"

[[headers]]
for = "/_app/version.json"
[headers.values]
Cache-Control = "no-cache, max-age=0, must-revalidate"

[[headers]]
for = "/_app/immutable/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"
