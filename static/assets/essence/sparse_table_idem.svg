irection="ltr" dominant-baseline="alphabetic">[L, L+2^i]</text></g><g transform="translate(17.220073247643086 143.08390086117424) rotate(0 25.34166717529297 12.5)"><text x="0" y="17.619999999999997" font-family="Excalifont, Xiaolai, sans-serif, Segoe UI Emoji" font-size="20px" fill="#b86200" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">[L,R]</text></g></svg>